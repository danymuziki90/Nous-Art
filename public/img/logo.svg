<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E2B9" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8437" />
      <stop offset="100%" stop-color="#EAD6A0" />
    </linearGradient>
    
    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monogram Emblem (Left) -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagonal Frame -->
    <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
    <!-- Inner Frame -->
    <polygon points="50,10 90,28 90,72 50,90 10,72 10,28" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4" />
    
    <!-- Central Geometric "N & A" Intersection -->
    <line x1="32" y1="30" x2="32" y2="70" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="32" y1="30" x2="68" y2="70" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="68" y1="70" x2="68" y2="30" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="32" y1="70" x2="50" y2="30" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="40" y1="52" x2="62" y2="52" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

    <circle cx="50" cy="20" r="1.5" fill="url(#goldGrad)" />
    <circle cx="50" cy="80" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Name & Subtitle Typography (Right) -->
  <g transform="translate(125, 30)">
    <!-- Main Title: NOUS ART -->
    <text x="0" y="32" font-family="'Cormorant Garamond', 'Cinzel', 'Didot', 'Playfair Display', serif" font-size="34" font-weight="600" letter-spacing="6" fill="#F5F5F4">
      NOUS <tspan fill="url(#goldGrad)" font-weight="400">ART</tspan>
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="46" x2="220" y2="46" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" />

    <!-- Subtitle: CONTEMPORARY ART GALLERY -->
    <text x="2" y="60" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8" font-weight="500" letter-spacing="3.5" fill="#A3A099">
      CONTEMPORARY ART GALLERY
    </text>
  </g>
</svg>
